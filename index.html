<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a15">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>موقعنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* ═══════════════════════════════════════════════
   موقعنا | Glassmorphism Design System
   ═══════════════════════════════════════════════ */
:root{
  --bg-deep:#080812;
  --bg-mid:#0e0e1c;
  --glass-bg:rgba(255,255,255,0.045);
  --glass-bg-strong:rgba(255,255,255,0.075);
  --glass-border:rgba(255,255,255,0.10);
  --glass-border-strong:rgba(255,255,255,0.18);
  --text-primary:#f4f5fb;
  --text-secondary:#a2a8bd;
  --text-muted:#6b7186;
  --accent:#7c5cff;
  --accent-2:#22d3ee;
  --accent-grad:linear-gradient(135deg,#7c5cff 0%,#22d3ee 100%);
  --success:#22c55e;
  --success-glow:rgba(34,197,94,.45);
  --gold:#fbbf24;
  --danger:#ef4444;
  --radius:20px;
  --radius-sm:14px;
  --shadow-glass:0 8px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  --shadow-float:0 24px 60px rgba(0,0,0,.6);
  --blur:blur(24px) saturate(160%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:'Tajawal',system-ui,-apple-system,sans-serif;
  background:var(--bg-deep);
  color:var(--text-primary);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  font-weight:500;
  letter-spacing:-0.01em;
}
/* الخلفية المتوهجة */
.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.orb-1{width:520px;height:520px;background:radial-gradient(circle,#7c5cff,transparent 70%);top:-180px;right:-160px}
.orb-2{width:460px;height:460px;background:radial-gradient(circle,#22d3ee,transparent 70%);bottom:-160px;left:-140px;opacity:.4}
.orb-3{width:380px;height:380px;background:radial-gradient(circle,#ec4899,transparent 70%);top:40%;left:55%;opacity:.22}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* ─── الحاوية ─── */
.container{max-width:540px;width:100%;margin:0 auto;padding:28px 20px 40px;flex:1;display:flex;flex-direction:column;justify-content:center}
.container-wide{max-width:720px}

/* ─── الشعار العلوي ─── */
.brand{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:6px;
}
.brand-mark{
  width:38px;height:38px;border-radius:12px;
  background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;color:#fff;
  box-shadow:0 8px 24px rgba(124,92,255,.4),inset 0 1px 0 rgba(255,255,255,.3);
}
.brand-text{
  font-size:1.9rem;font-weight:900;letter-spacing:-0.03em;
  background:linear-gradient(135deg,#fff 30%,#b7a8ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.subtitle{
  text-align:center;color:var(--text-secondary);
  font-size:.95rem;margin-bottom:32px;font-weight:500;
}

/* ─── بطاقة زجاجية ─── */
.glass{
  background:var(--glass-bg);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-glass);
  padding:22px;
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
  transition:border-color .25s,transform .2s;
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 40%);
}
.glass:hover{border-color:var(--glass-border-strong)}
.glass h2,.glass h3{
  font-size:1.05rem;font-weight:700;margin-bottom:14px;
  color:var(--text-primary);display:flex;align-items:center;gap:8px;
}
.glass h3 .tag{
  font-size:.7rem;font-weight:600;color:var(--text-muted);
  background:rgba(255,255,255,.05);
  padding:3px 8px;border-radius:20px;
  border:1px solid var(--glass-border);
  margin-right:auto;
}

/* ─── المدخلات ─── */
.input{
  width:100%;padding:14px 16px;
  background:rgba(0,0,0,.25);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  color:var(--text-primary);
  font-size:1rem;font-weight:500;
  font-family:inherit;
  margin-bottom:12px;
  transition:.2s;
  backdrop-filter:blur(8px);
}
.input:focus{
  outline:none;
  border-color:rgba(124,92,255,.6);
  background:rgba(124,92,255,.08);
  box-shadow:0 0 0 3px rgba(124,92,255,.15);
}
.input::placeholder{color:var(--text-muted)}
.input-code{
  text-align:center;
  font-size:1.6rem;
  font-weight:800;
  letter-spacing:8px;
  font-family:ui-monospace,'SF Mono',monospace;
  padding:16px;
  text-transform:uppercase;
}

/* ─── الأزرار ─── */
.btn{
  width:100%;padding:15px 20px;
  border:none;border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:1rem;font-weight:700;
  cursor:pointer;
  transition:transform .12s,box-shadow .25s,filter .2s;
  color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;
  position:relative;
  overflow:hidden;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{
  background:var(--accent-grad);
  box-shadow:0 10px 30px rgba(124,92,255,.35),inset 0 1px 0 rgba(255,255,255,.25);
}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn-ghost{
  background:rgba(255,255,255,.05);
  border:1px solid var(--glass-border);
  color:var(--text-primary);
  backdrop-filter:blur(10px);
}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.09)}
.btn-success{
  background:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);
  box-shadow:0 10px 30px rgba(34,197,94,.4),inset 0 1px 0 rgba(255,255,255,.25);
}
.btn-danger{
  background:rgba(239,68,68,.15);
  color:#fca5a5;
  border:1px solid rgba(239,68,68,.3);
}

/* ─── نصيحة الخطأ ─── */
.alert{
  padding:12px 16px;border-radius:12px;
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.3);
  color:#fca5a5;font-size:.9rem;font-weight:500;
  text-align:center;margin-top:8px;
}
.alert-success{
  background:rgba(34,197,94,.12);
  border-color:rgba(34,197,94,.3);
  color:#86efac;
}

/* ─── كود الغرفة (للمضيف) ─── */
.room-hero{
  text-align:center;margin-bottom:22px;
}
.room-hero small{
  color:var(--text-secondary);font-size:.85rem;
  font-weight:600;display:block;margin-bottom:8px;letter-spacing:.05em;
}
.room-hero b{
  font-size:2.6rem;font-weight:900;
  font-family:ui-monospace,'SF Mono',monospace;
  letter-spacing:10px;
  background:var(--accent-grad);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  padding-right:10px;display:inline-block;
}
.copy-hint{
  color:var(--text-muted);font-size:.78rem;margin-top:6px;
  cursor:pointer;user-select:none;
}
.copy-hint:hover{color:var(--text-secondary)}

/* ─── المؤقت ─── */
.timer-display{
  text-align:center;
  font-size:5rem;font-weight:800;
  font-family:ui-monospace,'SF Mono',monospace;
  font-variant-numeric:tabular-nums;
  margin:14px 0 22px;
  letter-spacing:-0.04em;
  line-height:1;
  transition:color .3s;
}
.timer-display.idle{color:#3a3f55;text-shadow:none}
.timer-display.active{
  color:#22d3ee;
  text-shadow:0 0 60px rgba(34,211,238,.6),0 0 100px rgba(34,211,238,.3);
}
.timer-display.finished{
  color:var(--success);
  text-shadow:0 0 60px var(--success-glow);
}

/* ─── بطاقات اللاعبين ─── */
.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.player-card{
  background:rgba(255,255,255,.035);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  padding:14px;
  transition:.25s;
  backdrop-filter:blur(10px);
}
.player-card.pressed{
  border-color:rgba(34,197,94,.5);
  background:rgba(34,197,94,.08);
  box-shadow:0 0 30px rgba(34,197,94,.15),inset 0 1px 0 rgba(255,255,255,.1);
}
.player-card .pname{
  font-size:.95rem;font-weight:700;margin-bottom:8px;
  color:var(--text-primary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.player-card .pstatus{
  font-size:1.4rem;font-weight:800;
  font-family:ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
  color:var(--text-muted);
}
.player-card.pressed .pstatus{color:var(--success)}
.player-card .plabel{
  font-size:.7rem;color:var(--text-muted);
  font-weight:600;letter-spacing:.05em;
  margin-top:4px;
}

/* ─── النتائج ─── */
.result-hero{
  text-align:center;padding:8px 0 18px;
  border-bottom:1px solid var(--glass-border);
  margin-bottom:18px;
}
.result-hero .label{
  color:var(--text-secondary);font-size:.85rem;
  font-weight:600;margin-bottom:6px;
}
.result-hero .target{
  font-size:2.6rem;font-weight:900;
  font-family:ui-monospace,monospace;
  color:var(--accent-2);
}
.result-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.result-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-radius:12px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--glass-border);
  transition:.2s;
}
.result-item.winner{
  background:rgba(251,191,36,.09);
  border-color:rgba(251,191,36,.4);
  box-shadow:0 0 30px rgba(251,191,36,.12);
}
.result-item .rname{font-weight:700;font-size:.95rem}
.result-item .rtime{
  font-family:ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
  font-size:1.05rem;font-weight:700;
}
.result-item .rdiff{
  font-family:ui-monospace,monospace;
  font-size:.8rem;color:var(--text-muted);
  font-weight:600;margin-top:2px;
}
.result-item.winner .rdiff{color:var(--gold)}
.winner-badge{
  text-align:center;font-size:1.2rem;font-weight:900;
  color:var(--gold);margin:8px 0 16px;
  text-shadow:0 0 30px rgba(251,191,36,.4);
}

/* ─── سجل الجولات ─── */
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{
  display:grid;grid-template-columns:auto 1fr 1fr auto;
  align-items:center;gap:10px;
  padding:10px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--glass-border);
  font-size:.85rem;
}
.history-item .hnum{
  width:26px;height:26px;border-radius:50%;
  background:rgba(124,92,255,.2);
  color:#b7a8ff;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;
}
.history-item .htarget{
  font-family:ui-monospace,monospace;
  color:var(--text-secondary);
  font-size:.8rem;
}
.history-item .hwin{
  color:var(--gold);font-weight:700;
  text-align:left;
}
.history-item .hwin::before{content:"🏆 ";margin-left:4px}

/* ─── واجهة اللاعب ─── */
.player-view{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;
  user-select:none;touch-action:manipulation;
  z-index:10;
}
.press-btn{
  width:min(72vw,340px);height:min(72vw,340px);
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4ade80 0%,#16a34a 65%,#15803d 100%);
  border:none;color:#fff;
  font-family:inherit;
  font-size:clamp(2rem,9vw,3.5rem);
  font-weight:900;letter-spacing:2px;
  cursor:pointer;
  box-shadow:
    0 0 80px rgba(34,197,94,.5),
    0 0 140px rgba(34,197,94,.25),
    0 20px 40px rgba(0,0,0,.4),
    inset 0 -12px 30px rgba(0,0,0,.3),
    inset 0 4px 12px rgba(255,255,255,.35);
  transition:transform .08s ease;
  position:relative;
}
.press-btn::after{
  content:"";position:absolute;inset:8px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  pointer-events:none;
}
.press-btn:active{transform:scale(.94)}
.player-state{
  font-size:1.9rem;font-weight:700;
  color:var(--text-secondary);
  text-align:center;padding:20px;
  line-height:1.5;
}
.player-state.pressed{color:var(--success);font-size:2.4rem}
.player-state.win{color:var(--gold)}
.player-state .sub{
  display:block;font-size:.95rem;color:var(--text-muted);
  margin-top:12px;font-weight:500;
}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ─── شاشة الدوران ─── */
.spinner{
  width:44px;height:44px;
  border:3px solid rgba(255,255,255,.08);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .9s linear infinite;
  margin:20px auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── الجوال ─── */
@media (max-width:480px){
  .brand-text{font-size:1.6rem}
  .timer-display{font-size:4rem}
  .room-hero b{font-size:2.1rem;letter-spacing:7px}
  .container{padding:20px 16px 30px}
  .glass{padding:18px;border-radius:16px}
}

/* ─── إخفاء شريط التمرير لكن إبقاء الوظيفة ─── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  موقعنا | Multi-Game Platform
// ═══════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://dncatiycgyjztzellcbt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-kiNISn0BX891Gk8PF-Y-w_xMhSIagc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── سجل الألعاب (توسعة مستقبلية سهلة) ───
const GAMES = {
  'timing-challenge': {
    id: 'timing-challenge',
    name: 'تحدي التوقيت',
    icon: '⏱️',
    tagline: 'اضغط في اللحظة الصحيحة',
    minPlayers: 2,
    maxPlayers: 2,
    enabled: true,
  },
  // أضف ألعابًا جديدة هنا لاحقًا بنفس الهيكل
  // 'reaction-duel': { ... }
};

// ─── الحالة العامة ───
const state = {
  screen: 'home',       // home | host | player | loading
  role: null,           // host | player
  gameType: 'timing-challenge',
  code: null,
  roomId: null,
  token: null,
  name: '',
  slot: null,
  roundStatus: 'waiting',
  roundNumber: 0,
  players: [],
  targetTime: '5',
  displayTime: '0.00',
  clockOffset: 0,
  timerHandle: null,
  channel: null,
  results: null,
  history: [],
  error: '',
  info: '',
};

// ─── أدوات ───
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n ?? 0).toFixed(2);

function saveSession(){
  try{ localStorage.setItem('mn_session', JSON.stringify({
    role:state.role, code:state.code, roomId:state.roomId,
    token:state.token, name:state.name, slot:state.slot, gameType:state.gameType,
  })); }catch(e){}
}
function loadSession(){
  try{ return JSON.parse(localStorage.getItem('mn_session')||'null'); }catch(e){ return null; }
}
function clearSession(){ try{ localStorage.removeItem('mn_session'); }catch(e){} }

// ═══════════════════════════════════════════════════════════
//  التصيير
// ═══════════════════════════════════════════════════════════
function render(){
  const app = $('#app');
  if(state.screen === 'loading'){
    app.innerHTML = `<div class="container"><div class="spinner"></div></div>`;
    return;
  }
  if(state.screen === 'home')   return renderHome(app);
  if(state.screen === 'host')   return renderHost(app);
  if(state.screen === 'player') return renderPlayer(app);
}

// ─── الشاشة الرئيسية ───
function renderHome(app){
  app.innerHTML = `
    <div class="container">
      <div class="brand">
        <div class="brand-mark">م</div>
        <div class="brand-text">موقعنا</div>
      </div>
      <p class="subtitle">${esc(GAMES[state.gameType].icon)} ${esc(GAMES[state.gameType].name)}</p>

      <div class="glass">
        <h3>اسمك <span class="tag">مطلوب</span></h3>
        <input id="nameInput" class="input" placeholder="اكتب اسمك هنا" value="${esc(state.name)}" maxlength="20" autocomplete="off">
      </div>

      <div class="glass">
        <h3>إنشاء غرفة جديدة</h3>
        <p style="color:var(--text-secondary);font-size:.88rem;margin-bottom:14px;line-height:1.6">
          ستكون أنت المضيف. ستحصل على كود لمشاركته مع أصدقائك.
        </p>
        <button class="btn btn-primary" id="createBtn">
          <span>ابدأ غرفة جديدة</span>
        </button>
      </div>

      <div class="glass">
        <h3>الانضمام إلى غرفة</h3>
        <input id="codeInput" class="input input-code" placeholder="ABCDE" maxlength="5" autocomplete="off">
        <button class="btn btn-ghost" id="joinBtn">انضمام كلاعب</button>
      </div>

      ${state.error ? `<div class="alert">${esc(state.error)}</div>` : ''}
    </div>
  `;
  $('#createBtn').onclick = createRoom;
  $('#joinBtn').onclick = joinRoom;
  $('#nameInput').oninput = e => { state.name = e.target.value; };
  $('#codeInput').oninput = e => { e.target.value = e.target.value.toUpperCase(); };
  $('#codeInput').onkeydown = e => { if(e.key === 'Enter') joinRoom(); };
  setTimeout(() => $('#nameInput')?.focus(), 100);
}

// ─── واجهة المضيف ───
function renderHost(app){
  const p1 = state.players.find(p => p.slot === 1) || { name:'—', pressed:false };
  const p2 = state.players.find(p => p.slot === 2) || { name:'—', pressed:false };
  const bothJoined = state.players.length === 2;
  const playing = state.roundStatus === 'active';
  const ended = state.roundStatus === 'ended';

  const timerClass = playing ? 'active' : (ended ? 'finished' : 'idle');
  const timerValue = playing ? state.displayTime : (ended ? state.displayTime : '0.00');

  let body = '';

  // قسم بدء الجولة
  if(!playing && !ended){
    body = `
      <div class="glass">
        <h3>إعداد الجولة <span class="tag">${bothJoined ? 'جاهز' : 'بانتظار اللاعبين'}</span></h3>
        <label style="color:var(--text-secondary);font-size:.85rem;font-weight:600;display:block;margin-bottom:8px">
          الوقت المستهدف (بالثواني)
        </label>
        <input id="targetInput" class="input" type="number" step="0.1" min="0.5" max="60"
               value="${esc(state.targetTime)}"
               style="text-align:center;font-size:1.8rem;font-weight:800;font-family:ui-monospace,monospace;padding:16px">
        <button class="btn btn-success" id="startBtn" ${!bothJoined ? 'disabled' : ''}>
          ${bothJoined ? '▶ ابدأ الجولة' : `بانتظار ${2 - state.players.length} لاعب`}
        </button>
      </div>
    `;
  } else if(playing){
    body = `
      <div class="glass" style="text-align:center;padding:16px">
        <div style="color:var(--accent-2);font-weight:700;font-size:.9rem" class="pulse">
          ● الجولة جارية — بانتظار ضغط اللاعبين
        </div>
      </div>
    `;
  }

  // حالة اللاعبين
  const playersCard = `
    <div class="glass">
      <h3>حالة اللاعبين</h3>
      <div class="player-grid">
        <div class="player-card ${p1.pressed ? 'pressed' : ''}">
          <div class="pname">${esc(p1.name)}</div>
          <div class="pstatus">${p1.pressed && p1.elapsed != null ? fmt(p1.elapsed) : (p1.pressed ? '✓' : '—')}</div>
          <div class="plabel">${p1.pressed && p1.elapsed != null ? 'ثانية' : (p1.pressed ? 'تم' : 'لم يضغط')}</div>
        </div>
        <div class="player-card ${p2.pressed ? 'pressed' : ''}">
          <div class="pname">${esc(p2.name)}</div>
          <div class="pstatus">${p2.pressed && p2.elapsed != null ? fmt(p2.elapsed) : (p2.pressed ? '✓' : '—')}</div>
          <div class="plabel">${p2.pressed && p2.elapsed != null ? 'ثانية' : (p2.pressed ? 'تم' : 'لم يضغط')}</div>
        </div>
      </div>
    </div>
  `;

  // نتائج الجولة
  let resultsCard = '';
  if(ended && state.results){
    const r = state.results;
    const sorted = [...r.players].sort((a,b) => (a.diff ?? 999) - (b.diff ?? 999));
    const winner = sorted[0];
    resultsCard = `
      <div class="glass" style="border-color:rgba(34,197,94,.3)">
        <h3>🏁 نتيجة الجولة ${r.round_number}</h3>
        <div class="result-hero">
          <div class="label">الوقت المطلوب</div>
          <div class="target">${fmt(r.target_time)}<small style="font-size:1rem;color:var(--text-muted)"> ث</small></div>
        </div>
        <div class="result-grid">
          ${r.players.map(p => `
            <div class="result-item ${p.slot === winner.slot ? 'winner' : ''}">
              <div>
                <div class="rname">${esc(p.name)}</div>
                <div class="rdiff">فرق ${p.diff != null ? fmt(p.diff) : '—'} ث</div>
              </div>
              <div class="rtime">${p.elapsed != null ? fmt(p.elapsed) : '—'} ث</div>
            </div>
          `).join('')}
        </div>
        <div class="winner-badge">🏆 ${esc(winner.name)}</div>
        <button class="btn btn-primary" id="newRoundBtn">جولة جديدة</button>
      </div>
    `;
  }

  // سجل الجولات
  let historyCard = '';
  if(state.history.length > 0){
    historyCard = `
      <div class="glass">
        <h3>سجل الجولات <span class="tag">${state.history.length}</span></h3>
        <div class="history-list">
          ${state.history.map(h => `
            <div class="history-item">
              <div class="hnum">${h.round_number}</div>
              <div class="htarget">${fmt(h.target)} ث</div>
              <div></div>
              <div class="hwin">${esc(h.winner)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="container">
      <div class="room-hero">
        <small>كود الغرفة</small>
        <b id="roomCodeText">${esc(state.code || '-----')}</b>
        <div class="copy-hint" id="copyBtn">📋 انسخ الكود وشاركه</div>
      </div>

      <div class="timer-display ${timerClass}" id="timerEl">${timerValue}</div>

      ${body}
      ${playersCard}
      ${resultsCard}
      ${historyCard}

      <button class="btn btn-danger" id="leaveBtn" style="margin-top:8px">مغادرة الغرفة</button>
    </div>
  `;

  $('#startBtn') && ($('#startBtn').onclick = startRound);
  $('#targetInput') && ($('#targetInput').oninput = e => { state.targetTime = e.target.value; });
  $('#newRoundBtn') && ($('#newRoundBtn').onclick = () => {
    state.results = null;
    state.roundStatus = 'waiting';
    state.displayTime = '0.00';
    // إعادة تعيين اللاعبين بصريًا
    state.players = state.players.map(p => ({...p, pressed:false, elapsed:null}));
    render();
  });
  $('#copyBtn') && ($('#copyBtn').onclick = () => {
    navigator.clipboard?.writeText(state.code);
    $('#copyBtn').textContent = '✓ تم النسخ';
    setTimeout(() => { const el = $('#copyBtn'); if(el) el.textContent = '📋 انسخ الكود وشاركه'; }, 1500);
  });
  $('#leaveBtn').onclick = leaveRoom;
}

// ─── واجهة اللاعب ───
function renderPlayer(app){
  const me = state.players.find(p => p.slot === state.slot);
  const isActive = state.roundStatus === 'active';
  const isEnded = state.roundStatus === 'ended';

  // نهاية الجولة — عرض النتيجة
  if(isEnded && state.results){
    const r = state.results;
    const sorted = [...r.players].sort((a,b) => (a.diff ?? 999) - (b.diff ?? 999));
    const winner = sorted[0];
    const iWon = me && winner.slot === me.slot;
    app.innerHTML = `
      <div class="player-view">
        <div class="player-state ${iWon ? 'win' : ''}">
          ${iWon ? '🏆 فزت!' : 'انتهت الجولة'}
          ${me ? `
            <span class="sub">وقتك: ${me.elapsed != null ? fmt(me.elapsed) : '—'} ث</span>
            <span class="sub">الفرق: ${me.diff != null ? fmt(me.diff) : '—'} ث</span>
          ` : ''}
          <span class="sub">الهدف كان ${fmt(r.target_time)} ث</span>
          <span class="sub" style="color:var(--gold);margin-top:16px">الفائز: ${esc(winner.name)}</span>
          <span class="sub" style="margin-top:20px">بانتظار الجولة التالية...</span>
        </div>
      </div>
    `;
    return;
  }

  // الجولة نشطة — زر أو تأكيد
  if(isActive){
    if(me?.pressed){
      app.innerHTML = `
        <div class="player-view">
          <div class="player-state pressed">
            ✓ تم الضغط
            <span class="sub">بانتظار اللاعب الآخر...</span>
          </div>
        </div>
      `;
      return;
    }
    app.innerHTML = `
      <div class="player-view">
        <button class="press-btn" id="pressBtn">اضغط</button>
      </div>
    `;
    const btn = $('#pressBtn');
    btn.addEventListener('pointerdown', e => { e.preventDefault(); pressNow(); }, { passive:false });
    return;
  }

  // الانتظار
  app.innerHTML = `
    <div class="player-view">
      <div class="player-state pulse">
        بانتظار بدء الجولة
        <span class="sub">ستُفعَّل التعليمات عند بدء المضيف</span>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════
//  المنطق الرئيسي
// ═══════════════════════════════════════════════════════════
async function createRoom(){
  state.error = '';
  const name = state.name.trim() || 'المضيف';
  state.screen = 'loading';
  render();

  const { data, error } = await sb.rpc('mn_create_room', {
    p_host_name: name,
    p_game: state.gameType,
  });

  if(error || data?.error){
    state.screen = 'home';
    state.error = error?.message || data?.error || 'فشل إنشاء الغرفة';
    return render();
  }

  Object.assign(state, {
    role:'host', code:data.code, roomId:data.room_id, token:data.host_token,
    name, screen:'host', roundStatus:'waiting', players:[], history:[],
  });
  saveSession();
  subscribeRealtime();
  render();
}

async function joinRoom(){
  state.error = '';
  const name = (state.name || '').trim() || 'لاعب';
  const code = ($('#codeInput')?.value || '').trim().toUpperCase();
  if(!code || code.length < 5){ state.error = 'أدخل كود الغرفة (5 أحرف)'; return render(); }

  state.screen = 'loading';
  render();

  const { data, error } = await sb.rpc('mn_join_room', { p_code: code, p_name: name });

  if(error || data?.error){
    state.screen = 'home';
    state.error = error?.message || data?.error || 'فشل الانضمام';
    return render();
  }

  Object.assign(state, {
    role:'player', code:data.code, roomId:data.room_id, token:data.player_token,
    slot:data.slot, name, screen:'player', roundStatus:'waiting',
    gameType: data.game_type || state.gameType, players:[],
  });
  saveSession();
  subscribeRealtime();
  render();
}

async function startRound(){
  const t = parseFloat(state.targetTime);
  if(isNaN(t) || t <= 0){ state.error = 'أدخل وقتًا صحيحًا'; return render(); }

  const { data, error } = await sb.rpc('tc_start_round', {
    p_code: state.code, p_host_token: state.token, p_target: t,
  });
  if(error || data?.error){
    state.error = error?.message || data?.error;
    render();
  }
}

async function pressNow(){
  const me = state.players.find(p => p.slot === state.slot);
  if(me?.pressed) return;
  if(me) me.pressed = true;
  render();
  const { error } = await sb.rpc('tc_press', { p_code:state.code, p_player_token:state.token });
  if(error) console.error('press:', error);
}

async function refreshState(){
  if(!state.code || !state.token) return;
  const { data, error } = await sb.rpc('tc_get_results', {
    p_code: state.code, p_token: state.token,
  });
  if(error){ console.error(error); return; }
  applyServerState(data);
}

function applyServerState(d){
  if(!d || d.error) return;

  state.roundStatus = d.round_status;
  state.roundNumber = d.round_number;

  state.players = (d.players || []).map(p => ({
    name:p.name, slot:p.slot, pressed:p.pressed,
    elapsed:p.elapsed ?? null, diff:p.diff ?? null,
  }));

  if(d.round_status === 'ended' && d.target_time != null){
    state.results = {
      round_number: d.round_number,
      target_time: Number(d.target_time),
      players: d.players,
    };
    if(state.role === 'host'){
      const winner = [...d.players].sort((a,b)=>(a.diff??999)-(b.diff??999))[0];
      const last = state.history[state.history.length-1];
      if(!last || last.round_number !== d.round_number){
        state.history.push({
          round_number: d.round_number,
          target: Number(d.target_time),
          winner: winner.name,
        });
      }
    }
  } else if(d.round_status === 'active' && d.started_at){
    startHostTimer(d.started_at);
    state.results = null;
  } else if(d.round_status === 'waiting'){
    stopHostTimer();
    state.displayTime = '0.00';
    state.results = null;
  }

  render();
}

// ═══════════════════════════════════════════════════════════
//  المؤقت (للمضيف فقط)
// ═══════════════════════════════════════════════════════════
function startHostTimer(startedAtISO){
  stopHostTimer();
  if(state.role !== 'host') return;
  const startedAt = new Date(startedAtISO).getTime();
  state.timerHandle = setInterval(() => {
    if(state.roundStatus !== 'active') return;
    const elapsed = (Date.now() + state.clockOffset - startedAt) / 1000;
    const el = $('#timerEl');
    if(el) el.textContent = Math.max(0, elapsed).toFixed(2);
  }, 33); // ~30fps كافٍ جدًا للعين
}
function stopHostTimer(){
  if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle = null; }
}

// ═══════════════════════════════════════════════════════════
//  Realtime
// ═══════════════════════════════════════════════════════════
function subscribeRealtime(){
  if(state.channel){ try{ sb.removeChannel(state.channel); }catch(e){} state.channel = null; }

  const ch = sb.channel(`room-${state.roomId}`, { config:{ broadcast:{ self:false } } });

  ch.on('postgres_changes', {
    event:'INSERT', schema:'public', table:'mn_events',
    filter:`room_id=eq.${state.roomId}`,
  }, payload => {
    const ev = payload.new;
    if(ev?.created_at){
      const serverNow = new Date(ev.created_at).getTime();
      state.clockOffset = serverNow - Date.now();
    }
    if(['player_joined','player_pressed','round_started','round_ended'].includes(ev.event_type)){
      refreshState();
    }
  });

  ch.subscribe(status => {
    if(status === 'SUBSCRIBED') refreshState();
  });

  state.channel = ch;
  // جلب أولي احتياطي
  setTimeout(refreshState, 250);
}

// ═══════════════════════════════════════════════════════════
//  مغادرة
// ═══════════════════════════════════════════════════════════
function leaveRoom(){
  if(state.channel){ try{ sb.removeChannel(state.channel); }catch(e){} state.channel = null; }
  stopHostTimer();
  clearSession();
  Object.assign(state, {
    screen:'home', role:null, code:null, roomId:null, token:null, slot:null,
    roundStatus:'waiting', roundNumber:0, players:[], displayTime:'0.00',
    results:null, history:[], error:'',
  });
  render();
}

// ═══════════════════════════════════════════════════════════
//  الإقلاع
// ═══════════════════════════════════════════════════════════
function boot(){
  const s = loadSession();
  if(s && s.code && s.token && s.role){
    Object.assign(state, {
      role:s.role, code:s.code, roomId:s.roomId, token:s.token,
      name:s.name, slot:s.slot, gameType:s.gameType || 'timing-challenge',
      screen: s.role === 'host' ? 'host' : 'player',
    });
    subscribeRealtime();
  }
  render();
}

document.addEventListener('visibilitychange', () => {
  if(!document.hidden && state.code && state.token) refreshState();
});

boot();
</script>
